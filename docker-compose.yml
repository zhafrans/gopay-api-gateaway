version: "3.8"

services:
  redis:
    image: redis:alpine
    container_name: gopay-redis
    restart: always
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis-data:/data
    command: redis-server --appendonly yes

  gopay-gateway:
    build: .
    container_name: gopay-gateway
    restart: always
    depends_on:
      - redis
    ports:
      - "127.0.0.1:3006:3006"
    env_file:
      - .env
    environment:
      - PORT=3006
      - REDIS_HOST=redis
      - REDIS_PORT=6379

volumes:
  redis-data:
